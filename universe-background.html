<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universe & Solar System Background</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* Optional overlay content demo */
  .ui-overlay {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .ui-panel {
    pointer-events: auto;
    background: rgba(10, 15, 30, 0.55);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 40px 50px;
    color: #e8eaf6;
    text-align: center;
    max-width: 600px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .ui-panel h1 {
    font-weight: 300;
    font-size: 2.2rem;
    letter-spacing: 2px;
    margin-bottom: 16px;
    color: #ffffff;
  }

  .ui-panel p {
    font-size: 1rem;
    line-height: 1.6;
    color: #a0a8c0;
    margin-bottom: 24px;
  }

  .ui-panel .btn {
    display: inline-block;
    padding: 12px 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: #02040a;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .ui-panel .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79, 172, 254, 0.35);
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- Demo overlay showing how UI content sits on top -->
<div class="ui-overlay">
  <div class="ui-panel">
    <h1>QUANTUM LAB</h1>
    <p>An interactive physics playground exploring the atomic and optical world. This background is a live canvas rendering of our solar system embedded in a starfield.</p>
    <a href="#" class="btn">Enter Laboratory</a>
  </div>
</div>

<script>
(function() {
  'use strict';
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');

  let W, H, CX, CY;
  let frame = 0;
  const stars = [];
  const shootingStars = [];
  const nebulae = [];
  let planets = [];
  const orbits = [];
  const asteroids = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    CX = W / 2;
    CY = H / 2;
  }

  window.addEventListener('resize', resize);
  resize();

  // Utility
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

  // Create starfield with multiple depth layers
  function initStars() {
    stars.length = 0;
    const density = Math.min((W * H) / 3000, 2500);
    for (let i = 0; i < density; i++) {
      const layer = Math.random();
      stars.push({
        x: rand(0, W),
        y: rand(0, H),
        r: layer < 0.02 ? rand(0.6, 1.8) : rand(0.2, 1.0),
        alpha: rand(0.2, 1.0),
        twinkleSpeed: rand(0.005, 0.03),
        twinkleOffset: rand(0, Math.PI * 2),
        parallax: layer < 0.1 ? 0.02 : (layer < 0.3 ? 0.01 : 0.005),
        color: pickStarColor()
      });
    }
  }

  function pickStarColor() {
    const roll = Math.random();
    if (roll < 0.7) return [220, 230, 255];       // white-blue
    if (roll < 0.85) return [255, 240, 200];      // warm
    if (roll < 0.95) return [180, 200, 255];     // blue
    return [255, 200, 200];                       // faint red
  }

  // Nebulae clouds
  function initNebulae() {
    nebulae.length = 0;
    const count = Math.floor(W / 500) + 2;
    for (let i = 0; i < count; i++) {
      nebulae.push({
        x: rand(0, W),
        y: rand(0, H),
        r: rand(150, 400),
        color: pickNebulaColor(),
        alpha: rand(0.03, 0.08),
        driftX: rand(-0.1, 0.1),
        driftY: rand(-0.05, 0.05)
      });
    }
  }

  function pickNebulaColor() {
    const palettes = [
      [80, 40, 140],
      [40, 100, 180],
      [180, 60, 100],
      [60, 160, 120]
    ];
    return palettes[randInt(0, palettes.length - 1)];
  }

  // Solar system data
  const planetData = [
    { name: 'Mercury', color: '#b5b5b5', r: 2.5, dist: 0.18, speed: 2.1, glow: '#888' },
    { name: 'Venus',   color: '#e8cda8', r: 4.0, dist: 0.26, speed: 1.5, glow: '#cba87a' },
    { name: 'Earth',   color: '#4fa4f4', r: 4.2, dist: 0.36, speed: 1.0, glow: '#2d8ad4', ring: '#4fa4f455' },
    { name: 'Mars',    color: '#e07050', r: 3.0, dist: 0.48, speed: 0.8,  glow: '#c05040' },
    { name: 'Jupiter', color: '#d4b896', r: 10,  dist: 0.68, speed: 0.4,  glow: '#b89a70', bands: true },
    { name: 'Saturn',  color: '#e0d0a0', r: 8.5, dist: 0.88, speed: 0.3,  glow: '#c8b888', hasRings: true },
    { name: 'Uranus',  color: '#a0e0e8', r: 5.5, dist: 1.05, speed: 0.2,  glow: '#80c8d8' },
    { name: 'Neptune', color: '#5060e0', r: 5.2, dist: 1.20, speed: 0.15, glow: '#4050c8' }
  ];

  const baseOrbitRadius = Math.min(W, H) * 0.18;

  function initPlanets() {
    planets = planetData.map((pd, i) => ({
      ...pd,
      angle: rand(0, Math.PI * 2),
      // Scale distances relative to canvas size
      orbitR: baseOrbitRadius * pd.dist,
      trail: []
    }));
  }

  // Asteroid belt between Mars (0.48) and Jupiter (0.68)
  function initAsteroids() {
    asteroids.length = 0;
    const count = Math.floor(baseOrbitRadius * 0.3);
    const inner = baseOrbitRadius * 0.52;
    const outer = baseOrbitRadius * 0.64;
    for (let i = 0; i < count; i++) {
      const dist = rand(inner, outer);
      const angle = rand(0, Math.PI * 2);
      asteroids.push({
        dist: dist,
        angle: angle,
        size: rand(0.3, 1.2),
        speed: 0.8 / Math.sqrt(dist / baseOrbitRadius) * rand(0.8, 1.2),
        alpha: rand(0.3, 0.7)
      });
    }
  }

  // Shooting stars
  function spawnShootingStar() {
    if (Math.random() < 0.003) {
      const angle = rand(0.2, 0.8); // mostly diagonal
      shootingStars.push({
        x: rand(0, W),
        y: rand(0, H * 0.3),
        vx: Math.cos(angle) * rand(8, 16),
        vy: Math.sin(angle) * rand(8, 16),
        len: rand(30, 80),
        alpha: 1,
        decay: rand(0.015, 0.03)
      });
    }
  }

  function initOrbits() {
    orbits.length = 0;
    planetData.forEach(pd => {
      orbits.push({
        r: baseOrbitRadius * pd.dist,
        alpha: 0.07
      });
    });
    // Add asteroid belt orbit rings
    const inner = baseOrbitRadius * 0.52;
    const outer = baseOrbitRadius * 0.64;
    for (let d = inner; d <= outer; d += 12) {
      orbits.push({ r: d, alpha: 0.02 });
    }
  }

  // Drawing functions
  function drawNebulae() {
    nebulae.forEach(n => {
      n.x += n.driftX;
      n.y += n.driftY;
      if (n.x < -n.r) n.x = W + n.r;
      if (n.x > W + n.r) n.x = -n.r;
      if (n.y < -n.r) n.y = H + n.r;
      if (n.y > H + n.r) n.y = -n.r;

      const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
      grad.addColorStop(0, `rgba(${n.color[0]},${n.color[1]},${n.color[2]},${n.alpha})`);
      grad.addColorStop(0.5, `rgba(${n.color[0]},${n.color[1]},${n.color[2]},${n.alpha * 0.4})`);
      grad.addColorStop(1, `rgba(${n.color[0]},${n.color[1]},${n.color[2]},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawStars() {
    ctx.save();
    stars.forEach(s => {
      const twinkle = 0.5 + 0.5 * Math.sin(frame * s.twinkleSpeed + s.twinkleOffset);
      const a = s.alpha * twinkle;
      if (a < 0.05) return;
      ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();

      // Glow for bright stars
      if (s.r > 1.2) {
        ctx.shadowColor = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},0.4)`;
        ctx.shadowBlur = s.r * 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    });
    ctx.restore();
  }

  function drawSun() {
    const sunR = baseOrbitRadius * 0.06;
    // Outer corona
    const corona = ctx.createRadialGradient(CX, CY, sunR * 0.4, CX, CY, sunR * 4);
    corona.addColorStop(0, 'rgba(255, 220, 120, 0.25)');
    corona.addColorStop(0.2, 'rgba(255, 180, 60, 0.1)');
    corona.addColorStop(1, 'rgba(255, 100, 20, 0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(CX, CY, sunR * 4, 0, Math.PI * 2);
    ctx.fill();

    // Sun body
    const sunGrad = ctx.createRadialGradient(CX - sunR * 0.3, CY - sunR * 0.3, sunR * 0.1, CX, CY, sunR);
    sunGrad.addColorStop(0, '#fff8e0');
    sunGrad.addColorStop(0.3, '#ffd060');
    sunGrad.addColorStop(0.7, '#ff9020');
    sunGrad.addColorStop(1, '#ff5010');
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(CX, CY, sunR, 0, Math.PI * 2);
    ctx.fill();

    // Sun surface texture / flares
    const flareCount = 8;
    for (let i = 0; i < flareCount; i++) {
      const a = (frame * 0.002 + (i / flareCount) * Math.PI * 2) % (Math.PI * 2);
      const fx = CX + Math.cos(a) * sunR * rand(0.7, 1.3);
      const fy = CY + Math.sin(a) * sunR * rand(0.7, 1.3);
      ctx.fillStyle = `rgba(255, 180, 40, ${0.15 + 0.1 * Math.sin(frame * 0.01 + i)})`;
      ctx.beginPath();
      ctx.arc(fx, fy, rand(1.5, 4), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawOrbits() {
    orbits.forEach(o => {
      ctx.strokeStyle = `rgba(255, 255, 255, ${o.alpha})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.ellipse(CX, CY, o.r, o.r * 0.35, 0, 0, Math.PI * 2);
      ctx.stroke();
    });
  }

  function drawAsteroids() {
    ctx.fillStyle = 'rgba(180, 170, 160, 0.7)';
    asteroids.forEach(a => {
      a.angle += a.speed * 0.003;
      const ax = CX + Math.cos(a.angle) * a.dist;
      const ay = CY + Math.sin(a.angle) * a.dist * 0.35; // perspective
      ctx.globalAlpha = a.alpha;
      ctx.beginPath();
      ctx.arc(ax, ay, a.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function drawPlanet(p) {
    const x = CX + Math.cos(p.angle) * p.orbitR;
    const y = CY + Math.sin(p.angle) * p.orbitR * 0.35; // perspective

    // Trail
    p.trail.push({ x, y });
    if (p.trail.length > 30) p.trail.shift();
    if (p.trail.length > 2) {
      ctx.beginPath();
      ctx.moveTo(p.trail[0].x, p.trail[0].y);
      for (let i = 1; i < p.trail.length; i++) {
        ctx.lineTo(p.trail[i].x, p.trail[i].y);
      }
      ctx.strokeStyle = `${p.color}22`;
      ctx.lineWidth = p.r * 0.3;
      ctx.stroke();
    }

    // Shadow / night side
    const grad = ctx.createRadialGradient(
      x - p.r * 0.3, y - p.r * 0.3, p.r * 0.1,
      x, y, p.r
    );
    grad.addColorStop(0, p.color);
    grad.addColorStop(0.65, p.color);
    grad.addColorStop(1, shadeColor(p.color, -40));

    ctx.shadowColor = p.glow;
    ctx.shadowBlur = p.r * 2.5;

    // Planet body
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, p.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Earth atmospheric ring
    if (p.ring) {
      ctx.strokeStyle = p.ring;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x, y, p.r + 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Jupiter bands
    if (p.bands) {
      ctx.strokeStyle = 'rgba(160, 130, 90, 0.3)';
      ctx.lineWidth = 1;
      for (let off = -p.r * 0.5; off <= p.r * 0.5; off += p.r * 0.25) {
        ctx.beginPath();
        ctx.ellipse(x, y + off, p.r * 0.9, p.r * 0.15, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Saturn rings
    if (p.hasRings) {
      const ringRx = p.r * 2.8;
      const ringRy = p.r * 0.5;
      const tilt = 0.3;

      ctx.strokeStyle = 'rgba(200, 190, 150, 0.25)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(x, y, ringRx, ringRy, tilt, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(200, 190, 150, 0.15)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(x, y, ringRx * 1.15, ringRy * 1.1, tilt, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function shadeColor(hex, percent) {
    let R = parseInt(hex.substring(1,3),16);
    let G = parseInt(hex.substring(3,5),16);
    let B = parseInt(hex.substring(5,7),16);
    R = Math.floor(R * (100 + percent) / 100);
    G = Math.floor(G * (100 + percent) / 100);
    B = Math.floor(B * (100 + percent) / 100);
    R = (R<255)?R:255;
    G = (G<255)?G:255;
    B = (B<255)?B:255;
    return `rgb(${R},${G},${B})`;
  }

  function drawShootingStars() {
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx;
      s.y += s.vy;
      s.alpha -= s.decay;

      if (s.alpha <= 0 || s.x > W || s.y > H) {
        shootingStars.splice(i, 1);
        continue;
      }

      ctx.strokeStyle = `rgba(220, 235, 255, ${s.alpha})`;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = 'rgba(180, 210, 255, 0.6)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * (s.len / 12), s.y - s.vy * (s.len / 12));
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  function animate() {
    frame++;
    ctx.clearRect(0, 0, W, H);

    // Background space gradient
    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, '#02040a');
    bgGrad.addColorStop(0.5, '#050a14');
    bgGrad.addColorStop(1, '#02040a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    drawNebulae();
    drawStars();
    spawnShootingStar();
    drawShootingStars();
    drawSun();
    drawOrbits();
    drawAsteroids();

    planets.forEach(p => {
      p.angle += p.speed * 0.003;
      drawPlanet(p);
    });

    requestAnimationFrame(animate);
  }

  // Initialize
  initStars();
  initNebulae();
  initOrbits();
  initPlanets();
  initAsteroids();
  animate();
})();
</script>

</body>
</html>
